name: Build iOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run static checks
        run: python3 iOSViewer/Scripts/check_ios_viewer.py

      - name: Build iOSViewerApp for iOS 16
        run: |
          set -euo pipefail
          sdkroot="$(xcrun --sdk iphoneos --show-sdk-path)"
          swift build -c release \
            --triple arm64-apple-ios16.0 \
            --product iOSViewerApp \
            -Xswiftc -sdk -Xswiftc "$sdkroot"

      - name: Assemble unsigned app archive
        run: |
          set -euo pipefail
          mkdir -p Payload/iOSViewer.app
          cp .build/arm64-apple-ios16.0/release/iOSViewerApp Payload/iOSViewer.app/iOSViewer
          cp iOSViewerApp-Info.plist Payload/iOSViewer.app/Info.plist
          codesign --force --sign - Payload/iOSViewer.app
          zip -qry iOSViewer.ipa Payload

      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: iOSViewer-unsigned
          path: iOSViewer.ipa
          if-no-files-found: error
