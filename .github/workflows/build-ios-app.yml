name: Build iOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include_dictionary:
        description: 'Nhúng 8bit.dat cho thiết bị này (dùng secret Actions)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run static checks
        run: python3 iOSViewer/Scripts/check_ios_viewer.py

      - name: Build iOSViewerApp for iOS 16
        run: |
          set -euo pipefail
          sdkroot="$(xcrun --sdk iphoneos --show-sdk-path)"
          swift build -c release \
            --package-path iOSViewer \
            --triple arm64-apple-ios16.0 \
            --product iOSViewerApp \
            -Xswiftc -sdk -Xswiftc "$sdkroot" \
            -Xcc -isysroot -Xcc "$sdkroot" \
            -Xcxx -isysroot -Xcxx "$sdkroot"

      - name: Assemble unsigned app bundle
        env:
          INCLUDE_DICTIONARY: ${{ inputs.include_dictionary }}
          DICT_PART1: ${{ secrets.IOSVIEWER_8BIT_PART1 }}
          DICT_PART2: ${{ secrets.IOSVIEWER_8BIT_PART2 }}
          DICT_PART3: ${{ secrets.IOSVIEWER_8BIT_PART3 }}
          DICT_PART4: ${{ secrets.IOSVIEWER_8BIT_PART4 }}
          DICT_PART5: ${{ secrets.IOSVIEWER_8BIT_PART5 }}
        run: |
          set -euo pipefail
          mkdir -p Payload/iOSViewer.app
          app_binary=""
          while IFS= read -r candidate; do
            if [ -x "$candidate" ] && file -b "$candidate" | grep -q 'Mach-O.*executable'; then
              app_binary="$candidate"
              break
            fi
          done < <(find iOSViewer/.build -type f -name iOSViewerApp)
          if [ -z "$app_binary" ]; then
            echo "Built iOSViewerApp executable was not found" >&2
            exit 1
          fi
          cp "$app_binary" Payload/iOSViewer.app/iOSViewer
          cp iOSViewerApp-Info.plist Payload/iOSViewer.app/Info.plist
          python3 iOSViewer/Scripts/make_app_icon.py Payload/iOSViewer.app
          if [ "$INCLUDE_DICTIONARY" = "true" ]; then
            printf '%s%s%s%s%s' "$DICT_PART1" "$DICT_PART2" "$DICT_PART3" "$DICT_PART4" "$DICT_PART5" \
              | base64 -D > Payload/iOSViewer.app/8bit.dat
            test "$(wc -c < Payload/iOSViewer.app/8bit.dat | tr -d ' ')" = "112640"
            test "$(shasum -a 256 Payload/iOSViewer.app/8bit.dat | awk '{print $1}')" = "9aa45789d9ff9d329a623a685d57b67e33c777019de9ce1f273f21860e4bfe6b"
          fi
          codesign --force --sign - Payload/iOSViewer.app

      - name: Build rootless DEB for jailbroken iOS
        run: |
          set -euo pipefail
          if ! command -v dpkg-deb >/dev/null 2>&1; then
            brew install dpkg
          fi
          stage="$(mktemp -d)"
          mkdir -p "$stage/DEBIAN" "$stage/var/jb/Applications/iOSViewer.app"
          cp Payload/iOSViewer.app/Info.plist "$stage/var/jb/Applications/iOSViewer.app/Info.plist"
          cp Payload/iOSViewer.app/iOSViewer "$stage/var/jb/Applications/iOSViewer.app/iOSViewer"
          cp Payload/iOSViewer.app/AppIcon*.png "$stage/var/jb/Applications/iOSViewer.app/"
          if [ -f Payload/iOSViewer.app/8bit.dat ]; then
            cp Payload/iOSViewer.app/8bit.dat "$stage/var/jb/Applications/iOSViewer.app/8bit.dat"
          fi
          cat > "$stage/DEBIAN/control" <<'EOF'
          Package: local.apelin.iosviewer
          Name: iOSViewer
          Version: 1.2
          Architecture: iphoneos-arm64
          Maintainer: Datkep92 <datkep92@users.noreply.github.com>
          Description: iOS 16 viewer ported from MacViewer, unsigned build
          Section: Applications
          Priority: optional
          Depends: firmware (>= 16.0), uikittools
          EOF
          cat > "$stage/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          uicache -p /var/jb/Applications/iOSViewer.app || true
          exit 0
          EOF
          chmod 755 "$stage/DEBIAN/postinst"
          dpkg-deb -b --root-owner-group "$stage" iOSViewer.deb

      - name: Package IPA for TrollStore
        run: zip -qry iOSViewer.ipa Payload

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.include_dictionary && 'iOSViewer-packages-device' || 'iOSViewer-packages' }}
          path: |
            iOSViewer.ipa
            iOSViewer.deb
          if-no-files-found: error
